<!DOCTYPE html>
<!-- ==========================================================================
     index.html  —  THE WEB PAGE YOU SEE IN THE BROWSER
     ==========================================================================
     This file describes the LOOK of the page:
       - the <style> section sets the colours and fonts (QUB red branding),
       - the <body> section lays out the logo, the input box, the buttons,
         and an empty table that gets filled in with results.
     The page on its own does nothing when you click. The real behaviour lives
     in app.js (loaded at the very bottom), which reacts to the buttons.
========================================================================== -->
<html>
<head>
<meta charset="utf-8">
<title>QUBCloud-FraudGuard</title>

<!-- config.js is generated by the frontend server and tells this page the two
     backend addresses. Loading it here lets app.js use SCREENING_URL and
     TALLY_URL. -->
<script src="config.js"></script>

<style type="text/css">
/* QUB brand: red #D6000D from the official logo, clean sans-serif wordmark. */
:root {
    --qub-red: #D6000D;
    --qub-red-dark: #a8000a;
    --qub-grey: #505050;
    --qub-font: "Helvetica Neue", Helvetica, Arial, sans-serif;
}
body {
    font-family: var(--qub-font);
    font-size: 16px;
    color: #222;
    margin: 0;
    background-color: #f4f4f4;
}

/* Branded header bar with the QUB logo. */
#header {
    position: relative;
    background-color: #ffffff;
    border-bottom: 4px solid var(--qub-red);
    padding: 1em 1.5em;
    min-height: 64px;
    display: flex;
    align-items: center;
    justify-content: center;
}
/* Logo pinned to the top-left corner; the app name stays centred. */
#header img {
    position: absolute;
    left: 1.5em;
    top: 50%;
    transform: translateY(-50%);
    height: 64px;
}
#logo {
    text-align: center;
    font-family: var(--qub-font);
    font-weight: 700;
    font-size: 28px;
    letter-spacing: 0.02em;
    color: var(--qub-red);
}
#logo .sub {
    display: block;
    font-weight: 400;
    font-size: 15px;
    color: var(--qub-grey);
    letter-spacing: 0.01em;
}

#qubcloud-fraudguard {
    max-width: 680px;
    margin: 1.5em auto;
    padding: 0 1em;
}
#normal-text {
    font-size: 18px;
    color: var(--qub-grey);
    margin: 0.6em 0 0.3em;
}

#input-div {
    text-align: center;
}
.input-items {
    font-size: 15px;
    color: #222;
    background-color: white;
    padding: 0.6em;
    margin: 0.3em 0;
    font-family: var(--qub-font);
    letter-spacing: 0.02em;
    width: 100%;
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 4px;
}
.input-items:focus {
    outline: none;
    border-color: var(--qub-red);
    box-shadow: 0 0 0 2px rgba(214, 0, 13, 0.15);
}

.buttons {
    text-align: center;
    margin: 0.6em 0 1.2em;
}
.button-active {
    background-color: var(--qub-red);
    color: white;
    padding: 0 32px;
    border: none;
    border-radius: 4px;
    font-family: var(--qub-font);
    font-size: 17px;
    font-weight: 600;
    margin: 4px;
    cursor: pointer;
    height: 48px;
    min-width: 180px;
}
.button-active:hover { background-color: var(--qub-red-dark); }
.button-clear {
    background-color: #ffffff;
    color: var(--qub-red);
    padding: 0 32px;
    border: 1px solid var(--qub-red);
    border-radius: 4px;
    font-family: var(--qub-font);
    font-size: 17px;
    font-weight: 600;
    margin: 4px;
    cursor: pointer;
    height: 48px;
    min-width: 180px;
}
.button-clear:hover { background-color: #fbeaea; }

/* Results */
#output-div {
    background-color: #ffffff;
    border: 1px solid #e0e0e0;
    border-top: 4px solid var(--qub-red);
    border-radius: 4px;
    padding: 0.5em 1em 1em;
}
#summary {
    font-size: 16px;
    margin: 0.4em 0;
    color: var(--qub-grey);
}
#results {
    width: 100%;
    border-collapse: collapse;
    font-size: 15px;
}
#results th {
    background-color: var(--qub-red);
    color: white;
    text-align: left;
    padding: 0.5em 0.7em;
    font-weight: 600;
}
#results td {
    border-bottom: 1px solid #eee;
    padding: 0.45em 0.7em;
}
#results tr:nth-child(even) td { background-color: #faf6f6; }
.decision-OK { color: #1e8449; font-weight: 600; }
.decision-SUSPICIOUS { color: var(--qub-red); font-weight: 700; }
.decision-ERROR { color: #b9770e; font-weight: 600; }
</style>
</head>
<body>

<!-- The branded header: the QUB logo plus the app name. -->
<div id="header">
    <img src="QUB_180_Years_Logo_Red_Landscape_RGB.png" alt="Queen's University Belfast">
    <div id="logo">
        QUBCloud-FraudGuard
        <span class="sub">Transaction screening service</span>
    </div>
</div>

<!-- The main area. Each element has an "id" so app.js can find it by name. -->
<div id="qubcloud-fraudguard">

    <!-- Where the user types or pastes the transactions to check. -->
    <div id="input-div">
        <p id="normal-text">
          Paste your transactions here (comma-separated, amount-card-country)..
        </p>
        <textarea class="input-items" id="input-text" rows="5"
                  placeholder="e.g. 5000-1234-UK,50000-9999-UK,200-4321-US,800-0000-CN"></textarea>
    </div>

    <!-- The buttons. "onclick" tells the browser which app.js function to run.
         "Screen" calls the screening service; "Tally" calls the country-tally
         service. Each one talks to its backend directly (no gateway). -->
    <div class="buttons">
        <button class="button-active" onclick="screenTransactions();">Screen</button>
        <button class="button-active" onclick="tallyTransactions();">Tally by country</button>
        <button class="button-clear" onclick="clearAll();">Clear</button>
    </div>

    <!-- The results area. It starts empty; app.js fills #summary and #results. -->
    <div id="output-div">
        <p id="normal-text">
          Results
        </p>
        <div id="summary"></div>
        <table id="results"></table>
    </div>
</div>

<!-- Load the page's behaviour LAST, so all the elements above already exist. -->
<script src="app.js"></script>
</body>
</html>
